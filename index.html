<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda Tattoo">
<title>Agenda Tattoo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-agenda.jpg">
<style>
  :root{
    --void:#0B0A09;
    --panel:rgba(24,21,18,.91);
    --panel-2:rgba(36,30,25,.94);
    --amber:#D8AE62;
    --amber-soft:rgba(216,174,98,.17);
    --crimson:#B6322D;
    --crimson-soft:rgba(182,50,45,.20);
    --text:#F1E8D7;
    --muted:#AB9D88;
    --hair:rgba(216,174,98,.18);
  }
  *{box-sizing:border-box;}
  html{min-height:100%;background:var(--void);}
  body{
    min-height:100%;
    margin:0;
    padding:16px 0;
    background-color:var(--void);
    background-image:
      radial-gradient(circle at 50% 5%,rgba(182,50,45,.32) 0 7rem,transparent 7.1rem),
      radial-gradient(circle at 0 100%,transparent 0 18px,rgba(216,174,98,.06) 19px 21px,transparent 22px 42px),
      radial-gradient(circle at 42px 100%,transparent 0 18px,rgba(216,174,98,.06) 19px 21px,transparent 22px 42px),
      linear-gradient(145deg,#090806 0%,#18120e 52%,#0d0b09 100%);
    background-position:center,0 0,0 21px,center;
    background-size:auto,84px 42px,84px 42px,auto;
    background-repeat:no-repeat,repeat,repeat,no-repeat;
    background-attachment:fixed;
  }
  .cal-wrap{
    background:linear-gradient(180deg,rgba(20,17,14,.89),rgba(10,9,8,.95));
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:28px 20px 40px;
    border-radius:18px;
    max-width:560px;
    margin:0 auto;
    border:1px solid rgba(216,174,98,.20);
    box-shadow:0 24px 70px rgba(0,0,0,.52),0 0 50px rgba(182,50,45,.08);
  }
  .cal-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .cal-brandline{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--hair);}
  .cal-seal{display:grid;place-items:center;width:48px;height:48px;flex:0 0 48px;border:2px solid var(--crimson);color:#E8C98D;background:rgba(182,50,45,.14);font-family:Georgia,serif;font-size:24px;transform:rotate(-2deg);box-shadow:inset 0 0 0 3px var(--void),0 0 18px rgba(182,50,45,.18);}
  .cal-brandcopy strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:20px;letter-spacing:3px;}
  .cal-brandcopy span{display:block;margin-top:3px;color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase;}
  .cal-kicker{display:block;color:var(--amber);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;}
  .cal-month{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.3px;
  }
  .cal-year{
    color:var(--muted);
    font-weight:400;
    font-size:20px;
    margin-left:6px;
  }
  .cal-nav{
    display:flex;
    gap:8px;
  }
  .cal-nav button{
    background:var(--panel);
    border:1px solid var(--hair);
    color:var(--text);
    min-width:44px;height:44px;
    border-radius:9px;
    font-size:16px;
    cursor:pointer;
  }
  .cal-nav .cal-today{width:auto;padding:0 12px;font-size:12px;font-weight:700;}
  .cal-nav button:hover{background:var(--panel-2);border-color:var(--amber);box-shadow:0 0 16px rgba(216,174,98,.18);}
  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
    margin-bottom:8px;
  }
  .cal-weekdays span{
    text-align:center;
    font-size:12px;
    color:var(--muted);
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .cal-day{
    aspect-ratio:1/1;
    background:var(--panel);
    border:1px solid var(--hair);
    border-radius:10px;
    padding:6px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:background .12s ease;
    position:relative;
    color:var(--text);
    font:inherit;
    text-align:left;
  }
  .cal-day:active{transform:scale(.96);}
  .cal-day:focus-visible,.cal-nav button:focus-visible,.cal-add-btn:focus-visible,.cal-close:focus-visible,.cal-del:focus-visible,input:focus-visible{outline:3px solid rgba(198,150,59,.45);outline-offset:2px;}
  .cal-day:hover{background:var(--panel-2);}
  .cal-day.empty{
    background:transparent;
    border:none;
    cursor:default;
  }
  .cal-day.selected{
    border-color:var(--amber);
    box-shadow:0 0 0 2px var(--void),0 0 0 4px var(--amber),0 0 20px rgba(216,174,98,.22);
  }
  .cal-day.today .cal-daynum{
    color:var(--amber);
  }
  .cal-day.has-normal{
    background:linear-gradient(145deg,#4DE8D1,#21AFC2);
    border-color:var(--amber);
  }
  .cal-day.has-larga{
    background:linear-gradient(145deg,#FF4D8D,#B82E8A);
    border-color:var(--crimson);
  }
  .cal-day.has-normal:hover, .cal-day.has-larga:hover{
    filter:brightness(1.08);
  }
  .cal-day.has-normal.today .cal-daynum{color:#1A140A;}
  .cal-daynum{
    font-size:13px;
    font-weight:600;
  }
  .cal-day.has-normal .cal-daynum{color:#1A140A;}
  .cal-day.has-larga .cal-daynum{color:#F7E9EA;}
  .cal-marks{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .cal-mark{
    font-size:9.5px;
    line-height:1.3;
    padding:1px 4px;
    border-radius:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .cal-mark.normal{background:var(--amber-soft);color:var(--amber);}
  .cal-mark.larga{background:var(--crimson-soft);color:var(--crimson);}
  .cal-mark.more{color:var(--muted);font-size:9px;}
  .cal-day.has-normal .cal-mark.normal{background:rgba(26,20,10,0.22);color:#1A140A;}
  .cal-day.has-larga .cal-mark.larga{background:rgba(0,0,0,0.28);color:#F7E9EA;}
  .cal-day.has-normal .cal-mark.more{color:rgba(26,20,10,0.6);}
  .cal-day.has-larga .cal-mark.more{color:rgba(247,233,234,0.6);}

  .cal-panel{
    margin-top:20px;
    background:var(--panel);
    border:1px solid var(--hair);
    border-radius:14px;
    padding:18px;
    animation:panelIn .2s ease-out;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 18px 45px rgba(0,0,0,.24);
  }
  @keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .cal-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .cal-panel-title{
    font-family:Georgia,serif;
    font-size:18px;
    margin-bottom:0;
  }
  .cal-close{width:44px;height:44px;border:0;border-radius:9px;background:var(--panel-2);color:var(--muted);font-size:18px;cursor:pointer;}
  .cal-form{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  .cal-form label{
    font-size:11px;
    color:var(--muted);
    display:block;
    margin-bottom:4px;
  }
  .cal-form input{
    background:var(--void);
    border:1px solid var(--hair);
    color:var(--text);
    border-radius:8px;
    padding:8px 10px;
    font-size:14px;
    width:100%;
  }
  .cal-field{flex:1;min-width:100px;}
  .cal-add-btn{
    background:linear-gradient(135deg,var(--amber),#41B8F5);
    color:#041015;
    border:none;
    border-radius:8px;
    padding:9px 16px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    align-self:flex-end;
  }
  .cal-add-btn:hover{opacity:.95;box-shadow:0 0 22px rgba(216,174,98,.24);}
  .cal-add-btn:active{transform:scale(.98);}
  .cal-hint{
    font-size:11.5px;
    color:var(--muted);
    margin:-8px 0 14px;
  }
  .cal-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .cal-item{
    background:var(--panel-2);
    border-radius:9px;
    padding:9px 12px;
  }
  .cal-item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .cal-item-left{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .cal-item-note{
    margin-top:6px;
    padding-top:6px;
    border-top:1px solid var(--hair);
    font-size:12.5px;
    color:var(--muted);
  }
  .cal-dot{
    width:9px;height:9px;border-radius:50%;
  }
  .cal-dot.normal{background:var(--amber);}
  .cal-dot.larga{background:var(--crimson);}
  .cal-item-time{font-weight:600;font-size:14px;}
  .cal-item-dur{color:var(--muted);font-size:12.5px;}
  .cal-del{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:15px;
    width:44px;height:44px;
  }
  .cal-del:hover{color:var(--crimson);}
  .cal-empty-msg{
    color:var(--muted);
    font-size:13px;
    padding:6px 0;
  }
  .cal-legend{
    display:flex;
    gap:16px;
    margin-top:18px;
    font-size:11.5px;
    color:var(--muted);
  }
  .cal-legend span{display:flex;align-items:center;gap:6px;}
  .cal-summary{display:flex;gap:8px;margin:16px 0 4px;}
  .cal-stat{flex:1;background:var(--panel);border:1px solid var(--hair);padding:10px 12px;border-radius:10px;}
  .cal-stat strong{display:block;font-family:Georgia,serif;font-size:20px;color:var(--text);}
  .cal-stat span{font-size:11px;color:var(--muted);}
  .cal-toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));z-index:10;transform:translate(-50%,20px);background:var(--text);color:var(--void);padding:11px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s ease;box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .cal-toast.show{opacity:1;transform:translate(-50%,0);}
  .cal-share{width:100%;min-height:46px;margin-top:12px;border:1px solid var(--amber);border-radius:9px;background:var(--amber-soft);color:var(--text);font-weight:700;letter-spacing:.2px;cursor:pointer;}
  .cal-share:hover{background:rgba(216,174,98,.26);}
  .cal-readonly{margin-bottom:16px;padding:11px 14px;border:1px solid var(--amber);border-radius:9px;background:var(--amber-soft);color:var(--text);font-size:13px;text-align:center;}
  body.readonly .cal-form,body.readonly .cal-hint,body.readonly .cal-del,body.readonly .cal-share{display:none;}
  @media(max-width:420px){
    body{padding:0}.cal-wrap{padding:20px 12px 32px;border-radius:0}.cal-header{align-items:flex-end}.cal-month{font-size:24px}.cal-year{font-size:17px}.cal-grid,.cal-weekdays{gap:4px}.cal-day{padding:5px;border-radius:8px;min-height:43px}.cal-mark{display:none}.cal-day.has-normal::after,.cal-day.has-larga::after{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;align-self:center}.cal-form{display:grid;grid-template-columns:1fr 1fr}.cal-field{min-width:0}.cal-form .cal-field:first-child{grid-column:1/-1}.cal-add-btn{min-height:46px}.cal-summary{margin-top:12px}}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="cal-wrap">
  <div class="cal-brandline" aria-label="Duvan Tattoo">
    <div class="cal-seal" aria-hidden="true">墨</div>
    <div class="cal-brandcopy"><strong>DUVAN TATTOO</strong><span>Lealtad · Arte · Pasión</span></div>
  </div>
  <div class="cal-readonly" id="readonlyBanner" hidden>Vista compartida · Solo lectura</div>
  <div class="cal-header">
    <div>
      <span class="cal-kicker">Agenda Tattoo</span>
      <span class="cal-month" id="monthLabel"></span>
      <span class="cal-year" id="yearLabel"></span>
    </div>
    <div class="cal-nav">
      <button id="prevBtn" aria-label="Mes anterior">‹</button>
      <button class="cal-today" id="todayBtn">Hoy</button>
      <button id="nextBtn" aria-label="Mes siguiente">›</button>
    </div>
  </div>

  <div class="cal-weekdays">
    <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
  </div>

  <div class="cal-grid" id="calGrid"></div>

  <div class="cal-summary" aria-live="polite">
    <div class="cal-stat"><strong id="monthCount">0</strong><span>Citas este mes</span></div>
    <div class="cal-stat"><strong id="monthHours">0h</strong><span>Horas reservadas</span></div>
  </div>
  <button class="cal-share" id="shareBtn" type="button">Compartir agenda · Solo lectura</button>

  <div class="cal-legend">
    <span><span class="cal-dot normal"></span> Cita normal</span>
    <span><span class="cal-dot larga"></span> Sesión larga (5h+)</span>
  </div>

  <div class="cal-panel" id="panel" style="display:none;">
    <div class="cal-panel-head">
      <div class="cal-panel-title" id="panelDate"></div>
      <button class="cal-close" id="closeBtn" aria-label="Cerrar detalle">✕</button>
    </div>

    <div class="cal-form">
      <div class="cal-field">
        <label for="inputName">Nombre del cliente</label>
        <input type="text" id="inputName" placeholder="Ej. Karla">
      </div>
      <div class="cal-field">
        <label for="inputTime">Hora</label>
        <input type="time" id="inputTime" value="12:00">
      </div>
      <div class="cal-field">
        <label for="inputHours">Duración (horas)</label>
        <input type="number" id="inputHours" value="2" step="0.5" min="0.5">
      </div>
    </div>
    <div class="cal-form">
      <div class="cal-field" style="flex:2;">
        <label for="inputNote">Recordatorio (opcional)</label>
        <input type="text" id="inputNote" placeholder="Ej. traer referencia, cobrar depósito...">
      </div>
      <button class="cal-add-btn" id="addBtn">Agregar cita</button>
    </div>
    <div class="cal-hint">5 horas o más se marca automáticamente como sesión larga.</div>

    <div class="cal-list" id="citaList"></div>
  </div>
</div>
<div class="cal-toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const STORAGE_KEY = 'tattoo-citas-v1';
  let citas = {}; // { "2026-09-10": [{id,time,hours,name,note}] }
  let current = new Date();
  current.setDate(1);
  let selectedKey = null;
  let readOnly = false;

  const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const monthLabel = document.getElementById('monthLabel');
  const yearLabel = document.getElementById('yearLabel');
  const grid = document.getElementById('calGrid');
  const panel = document.getElementById('panel');
  const panelDate = document.getElementById('panelDate');
  const citaList = document.getElementById('citaList');
  const inputName = document.getElementById('inputName');
  const inputTime = document.getElementById('inputTime');
  const inputHours = document.getElementById('inputHours');
  const inputNote = document.getElementById('inputNote');
  const toast = document.getElementById('toast');
  const shareBtn = document.getElementById('shareBtn');
  const readonlyBanner = document.getElementById('readonlyBanner');
  let toastTimer;

  function showToast(message){
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
  }

  function keyFor(y,m,d){
    return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }

  async function load(){
    try{
      const shared = new URLSearchParams(location.hash.slice(1)).get('ver');
      if(shared){
        citas = decodeShared(shared);
        readOnly = true;
        document.body.classList.add('readonly');
        readonlyBanner.hidden = false;
      }else{
        const saved = localStorage.getItem(STORAGE_KEY);
        citas = saved ? JSON.parse(saved) : {};
      }
    }catch(e){
      citas = {};
    }
    render();
  }

  async function save(){
    if(readOnly) return;
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(citas));
    }catch(e){
      console.error('No se pudo guardar', e);
    }
  }

  function encodeShared(data){
    const bytes = new TextEncoder().encode(JSON.stringify(data));
    let binary = '';
    bytes.forEach(byte=>binary += String.fromCharCode(byte));
    return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }

  function decodeShared(value){
    const base64 = value.replace(/-/g,'+').replace(/_/g,'/') + '='.repeat((4-value.length%4)%4);
    const binary = atob(base64);
    const bytes = Uint8Array.from(binary,char=>char.charCodeAt(0));
    const payload = JSON.parse(new TextDecoder().decode(bytes));
    return payload && payload.citas && typeof payload.citas === 'object' ? payload.citas : {};
  }

  async function shareAgenda(){
    const url = location.href.split('#')[0] + '#ver=' + encodeShared({v:1,citas});
    try{
      if(navigator.share){
        await navigator.share({title:'Agenda Duvan Tattoo',text:'Agenda de citas en modo solo lectura',url});
      }else{
        await navigator.clipboard.writeText(url);
        showToast('Enlace copiado');
      }
    }catch(e){
      if(e.name !== 'AbortError') prompt('Copia este enlace para compartir:',url);
    }
  }

  function render(){
    const y = current.getFullYear();
    const m = current.getMonth();
    monthLabel.textContent = monthNames[m];
    yearLabel.textContent = y;
    const monthEntries = Object.entries(citas).filter(([key])=>key.startsWith(y+'-'+String(m+1).padStart(2,'0'))).flatMap(([,items])=>items);
    document.getElementById('monthCount').textContent = monthEntries.length;
    document.getElementById('monthHours').textContent = monthEntries.reduce((sum,c)=>sum+Number(c.hours||0),0).toLocaleString('es-CO')+'h';

    const firstDay = new Date(y,m,1);
    let startOffset = firstDay.getDay() - 1; // lunes=0
    if(startOffset < 0) startOffset = 6;
    const daysInMonth = new Date(y,m+1,0).getDate();

    const todayKey = keyFor(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

    grid.innerHTML = '';

    for(let i=0;i<startOffset;i++){
      const empty = document.createElement('div');
      empty.className = 'cal-day empty';
      grid.appendChild(empty);
    }

    for(let d=1; d<=daysInMonth; d++){
      const k = keyFor(y,m,d);
      const dayCitas = (citas[k]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
      const hasLarga = dayCitas.some(c=>c.hours>=5);
      const hasNormal = dayCitas.some(c=>c.hours<5);
      const fillClass = hasLarga ? ' has-larga' : (hasNormal ? ' has-normal' : '');

      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-day' + (k===todayKey ? ' today':'') + (k===selectedKey ? ' selected':'') + fillClass;
      cell.dataset.key = k;
      cell.setAttribute('aria-label', d+' de '+monthNames[m]+', '+dayCitas.length+' citas');

      const num = document.createElement('div');
      num.className = 'cal-daynum';
      num.textContent = d;
      cell.appendChild(num);

      const marks = document.createElement('div');
      marks.className = 'cal-marks';
      dayCitas.slice(0,2).forEach(c=>{
        const m2 = document.createElement('div');
        m2.className = 'cal-mark ' + (c.hours>=5 ? 'larga':'normal');
        m2.textContent = c.time + (c.name ? ' · '+c.name : '');
        marks.appendChild(m2);
      });
      if(dayCitas.length>2){
        const more = document.createElement('div');
        more.className = 'cal-mark more';
        more.textContent = '+'+(dayCitas.length-2)+' más';
        marks.appendChild(more);
      }
      cell.appendChild(marks);

      cell.addEventListener('click', ()=> selectDay(k));
      grid.appendChild(cell);
    }
  }

  function selectDay(k){
    selectedKey = k;
    panel.style.display = 'block';
    const [y,m,d] = k.split('-').map(Number);
    const dateObj = new Date(y, m-1, d);
    const weekdays = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
    panelDate.textContent = weekdays[dateObj.getDay()] + ' ' + d + ' de ' + monthNames[m-1];
    renderList();
    render();
    setTimeout(()=>panel.scrollIntoView({behavior:'smooth',block:'nearest'}),0);
  }

  function renderList(){
    citaList.innerHTML = '';
    const dayCitas = (citas[selectedKey]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
    if(dayCitas.length===0){
      const msg = document.createElement('div');
      msg.className = 'cal-empty-msg';
      msg.textContent = 'Sin citas todavía.';
      citaList.appendChild(msg);
      return;
    }
    dayCitas.forEach(c=>{
      const item = document.createElement('div');
      item.className = 'cal-item';

      const row = document.createElement('div');
      row.className = 'cal-item-row';
      const left = document.createElement('div');
      left.className = 'cal-item-left';
      const dot = document.createElement('span');
      dot.className = 'cal-dot ' + (c.hours>=5 ? 'larga':'normal');
      const time = document.createElement('span');
      time.className = 'cal-item-time';
      time.textContent = c.time + (c.name ? ' — '+c.name : '');
      const dur = document.createElement('span');
      dur.className = 'cal-item-dur';
      dur.textContent = c.hours + 'h' + (c.hours>=5 ? ' · sesión larga':'');
      left.appendChild(dot);
      left.appendChild(time);
      left.appendChild(dur);
      const del = document.createElement('button');
      del.className = 'cal-del';
      del.textContent = '✕';
      del.setAttribute('aria-label','Eliminar cita de '+(c.name||c.time));
      del.addEventListener('click', ()=> deleteCita(c.id));
      row.appendChild(left);
      row.appendChild(del);
      item.appendChild(row);

      if(c.note){
        const note = document.createElement('div');
        note.className = 'cal-item-note';
        note.textContent = c.note;
        item.appendChild(note);
      }

      citaList.appendChild(item);
    });
  }

  async function addCita(){
    if(!selectedKey) return;
    const name = inputName.value.trim();
    const time = inputTime.value || '12:00';
    const hours = parseFloat(inputHours.value) || 1;
    const note = inputNote.value.trim();
    if(!citas[selectedKey]) citas[selectedKey] = [];
    citas[selectedKey].push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), time, hours, name, note });
    await save();
    inputName.value = '';
    inputNote.value = '';
    renderList();
    render();
    showToast('Cita guardada');
  }

  async function deleteCita(id){
    if(!selectedKey || !citas[selectedKey]) return;
    if(!confirm('¿Eliminar esta cita?')) return;
    citas[selectedKey] = citas[selectedKey].filter(c=>c.id!==id);
    if(citas[selectedKey].length===0) delete citas[selectedKey];
    await save();
    renderList();
    render();
    showToast('Cita eliminada');
  }

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    current.setMonth(current.getMonth()-1);
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    current.setMonth(current.getMonth()+1);
    render();
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    const now = new Date();
    current = new Date(now.getFullYear(),now.getMonth(),1);
    render();
    selectDay(keyFor(now.getFullYear(),now.getMonth(),now.getDate()));
  });
  document.getElementById('closeBtn').addEventListener('click', ()=>{
    selectedKey = null;
    panel.style.display = 'none';
    render();
  });
  document.getElementById('addBtn').addEventListener('click', addCita);
  shareBtn.addEventListener('click', shareAgenda);
  inputNote.addEventListener('keydown', e=>{if(e.key==='Enter') addCita();});

  load();
})();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
}
</script>
</body>
</html>
